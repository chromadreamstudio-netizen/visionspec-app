# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d6e7293ee0fc146d5199d1890cf722b8"
name = "beneficial-valuation-app"
application_url = "https://visionspec-app-1.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://visionspec-app-1.onrender.com/auth/callback",
  "https://visionspec-app-1.onrender.com/auth/shopify/callback",
  "https://visionspec-app-1.onrender.com/api/auth/callback"
]